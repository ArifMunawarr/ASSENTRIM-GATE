server {
    listen 0.0.0.0:8080;
    server_name 10.70.10.10;

    root /var/www/ASSENTRIM-GATE/dist;
    index index.html;

    # Keep this before the asset regex so hidden files are always denied.
    location ~ (^|/)\. {
        deny all;
    }

    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    # Vite generates content-hashed filenames in this directory.
    location ~ ^/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Missing static files must not return the SPA HTML document.
    location ~* \.(css|js|mjs|map|json|png|jpe?g|gif|ico|svg|webp|avif|woff2?|ttf|otf|eot|mp4|webm|pdf|txt|xml)$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
